<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VEGROTS // Csapat Kvíz Bajnokság</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #22c55e;
      --text: #f8fafc;
      --muted: #94a3b8;
      --danger: #ef4444;
      --border: #334155;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
    body { background-color: var(--bg); color: var(--text); padding: 1.5rem; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 680px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
    h1 { font-size: 1.4rem; color: var(--accent); }
    .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .team-badge { background: #1e3a8a; border: 1px solid #3b82f6; color: white; padding: 0.5rem 1.2rem; border-radius: 9999px; font-size: 1.15rem; font-weight: bold; display: flex; align-items: center; gap: 0.5rem; }
    .round-badge { color: var(--muted); font-size: 0.95rem; font-weight: 600; background: var(--card); border: 1px solid var(--border); padding: 0.4rem 0.8rem; border-radius: 0.5rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 1rem; padding: 1.5rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
    .category { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); margin-bottom: 0.5rem; font-weight: bold; }
    .question { font-size: 1.25rem; font-weight: 600; margin-bottom: 1.5rem; line-height: 1.4; }
    .options { display: flex; flex-direction: column; gap: 0.75rem; }
    button.opt-btn { background: #283548; color: var(--text); border: 1px solid var(--border); border-radius: 0.75rem; padding: 1rem; font-size: 1rem; text-align: left; cursor: pointer; transition: all 0.2s; }
    button.opt-btn:hover:not(:disabled) { border-color: var(--accent); background: #334155; }
    button.opt-btn.correct { background: rgba(34, 197, 94, 0.25); border-color: var(--accent); color: #4ade80; }
    button.opt-btn.wrong { background: rgba(239, 68, 68, 0.25); border-color: var(--danger); color: #f87171; }
    .footer-action { margin-top: 1.5rem; display: flex; justify-content: space-between; align-items: center; min-height: 48px; }
    .feedback { font-weight: bold; font-size: 1.05rem; }
    .btn-next { background: var(--accent); color: #052e16; font-weight: bold; border: none; padding: 0.8rem 1.5rem; border-radius: 0.5rem; cursor: pointer; display: none; }
    .score-screen { text-align: center; padding: 2rem 0; }
    .scoreboard { margin: 1.5rem 0; text-align: left; background: #0f172a; padding: 1rem; border-radius: 0.5rem; }
    .score-row { display: flex; justify-content: space-between; align-items: center; padding: 0.6rem 0; border-bottom: 1px solid var(--border); }
    .score-row:last-child { border-bottom: none; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <h1>VEGROTS // Csapat Kvíz</h1>
      <span style="color: var(--muted); font-size: 0.85rem;">Sulikert Labor • 4. Osztály</span>
    </div>
    <a href="index.html" style="color: var(--accent); text-decoration: none; font-size: 0.9rem; font-weight: 500;">← Vissza a Hub-ra</a>
  </header>

  <div id="quiz-container">
    <div class="status-bar">
      <div id="current-team" class="team-badge">🌾 Arany Kalászok</div>
      <div id="round-indicator" class="round-badge">1. Forduló / 5</div>
    </div>

    <div class="card">
      <div id="q-category" class="category">Kategória</div>
      <div id="q-text" class="question">Kérdés betöltése...</div>
      <div id="q-options" class="options"></div>
      
      <div class="footer-action">
        <div id="feedback" class="feedback"></div>
        <button id="btn-next" class="btn-next" onclick="nextStep()">Következő csapat ➔</button>
      </div>
    </div>
  </div>

  <div id="result-container" class="card score-screen" style="display: none;">
    <h2>🏆 5 Fordulós Kvíz Befejezve!</h2>
    <p style="color: var(--muted); margin-top: 0.5rem;">A megszerzett pontok elmentve a VEGROTS rendszerébe.</p>
    
    <div class="scoreboard" id="score-summary"></div>

    <button class="btn-next" style="display: inline-block; margin-top: 1rem;" onclick="location.reload()">Új menet indítása</button>
  </div>
</div>

<script src="questions.js"></script>
<script src="questions.js"></script>
<script>
  // 1. A VEGROTS eredeti csapatai
  const DEFAULT_TEAMS = [
    { id: 1, name: "Arany Kalászok", logo: "🌾", score: 0, pin: "1111" },
    { id: 2, name: "Mag Páncélosok", logo: "🛡️", score: 0, pin: "2222" },
    { id: 3, name: "Kemény Magok", logo: "⚫", score: 0, pin: "3333" },
    { id: 4, name: "Zöld Lándzsások", logo: "🌱", score: 0, pin: "4444" },
    { id: 5, name: "Gémorr Fúrók", logo: "🔩", score: 0, pin: "5555" },
    { id: 6, name: "Mag-Ágyúsok", logo: "💥", score: 0, pin: "6666" },
    { id: 7, name: "Vitorlázó Jávaiak", logo: "🪁", score: 0, pin: "7777" },
    { id: 8, name: "Hangya-Taxik", logo: "🐜", score: 0, pin: "8888" }
  ];

  // 2. Apps Script WebApp URL
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwV50HLzLRAvtARPDB1_8uJYv-TCNEcoj4Qzuz3GttDoUdiQhrVGdqyLjAZJjWwwXWb2w/exec";
  const TOTAL_ROUNDS = 5;

  let teams = [];
  let currentRound = 1;
  let teamIndex = 0;
  let questionPool = [];
  let currentQuestion = null;
  let roundScores = {}; // Csak az órai játék pontjai csapatnevek szerint

  function initApp() {
    const stored = localStorage.getItem("vegrots_teams") || localStorage.getItem("teams");
    if (stored) {
      try {
        teams = JSON.parse(stored);
      } catch (e) {
        teams = DEFAULT_TEAMS;
      }
    } else {
      teams = DEFAULT_TEAMS;
    }

    // Csapatnevek alapján inicializáljuk az órai pontszámlálót
    roundScores = {};
    teams.forEach(t => roundScores[t.name] = 0);

    // Kérdéspakli keverése
    questionPool = [...QUESTIONS_DB].sort(() => 0.5 - Math.random());
    currentRound = 1;
    teamIndex = 0;

    loadQuestion();
  }

  function loadQuestion() {
    if (questionPool.length === 0) {
      questionPool = [...QUESTIONS_DB].sort(() => 0.5 - Math.random());
    }
    currentQuestion = questionPool.pop();

    const activeTeam = teams[teamIndex];
    document.getElementById("current-team").innerHTML = `${activeTeam.logo} ${activeTeam.name}`;
    document.getElementById("round-indicator").innerText = `${currentRound}. Forduló / ${TOTAL_ROUNDS}`;
    document.getElementById("q-category").innerText = currentQuestion.category;
    document.getElementById("q-text").innerText = currentQuestion.question;
    document.getElementById("feedback").innerText = "";
    document.getElementById("btn-next").style.display = "none";

    const optsContainer = document.getElementById("q-options");
    optsContainer.innerHTML = "";

    const shuffledOpts = [...currentQuestion.options].sort(() => 0.5 - Math.random());

    shuffledOpts.forEach(opt => {
      const btn = document.createElement("button");
      btn.className = "opt-btn";
      btn.innerText = opt;
      btn.onclick = () => handleAnswer(btn, opt, currentQuestion.correct, activeTeam);
      optsContainer.appendChild(btn);
    });
  }

  function handleAnswer(btn, selected, correct, activeTeam) {
    const allBtns = document.querySelectorAll(".opt-btn");
    allBtns.forEach(b => b.disabled = true);

    const feedback = document.getElementById("feedback");

    if (selected === correct) {
      btn.classList.add("correct");
      feedback.style.color = "var(--accent)";
      feedback.innerText = `✅ Helyes! +1 pont a(z) ${activeTeam.name} részére.`;
      
      // Helyi számláló és szerverhívás az igazi névvel (pl. "Mag Páncélosok")
      roundScores[activeTeam.name] = (roundScores[activeTeam.name] || 0) + 10;
      awardPointToTeam(activeTeam, 1);
    } else {
      btn.classList.add("wrong");
      feedback.style.color = "var(--danger)";
      feedback.innerText = `❌ Nem jó! 0 pont. (Helyes: ${correct})`;
      allBtns.forEach(b => {
        if (b.innerText === correct) b.classList.add("correct");
      });
    }

    document.getElementById("btn-next").style.display = "block";
  }

  function nextStep() {
    teamIndex++;
    
    // Mind a 8 csapat után fordulószámlálás
    if (teamIndex >= teams.length) {
      teamIndex = 0;
      currentRound++;
    }

    if (currentRound > TOTAL_ROUNDS) {
      finishGame();
    } else {
      loadQuestion();
    }
  }

  function awardPointToTeam(teamObj, pts) {
    const teamName = teamObj.name;

    // 1. Frissítés a localStorage-ban
    const stored = localStorage.getItem("vegrots_teams") || localStorage.getItem("teams");
    let allTeams = stored ? JSON.parse(stored) : teams;
    
    const target = allTeams.find(t => t.name === teamName);
    if (target) {
      target.score = (target.score || 0) + pts;
      target.quizScore = (target.quizScore || 0) + pts;
      localStorage.setItem("vegrots_teams", JSON.stringify(allTeams));
      localStorage.setItem("teams", JSON.stringify(allTeams));
    }

    // 2. Apps Script küldés a feldolgozható névvel
    if (APPS_SCRIPT_URL && !APPS_SCRIPT_URL.includes("IDE_ILLESZD")) {
      fetch(APPS_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "addPoints",
          team: teamName,        // <-- Pontosan: "Mag Páncélosok", "Kemény Magok", stb.
          teamName: teamName,
          points: pts,
          score: pts,
          timestamp: new Date().toISOString()
        })
      }).catch(err => console.warn("Hálózati hiba:", err));
    }
  }

  function finishGame() {
    document.getElementById("quiz-container").style.display = "none";
    document.getElementById("result-container").style.display = "block";

    const summary = document.getElementById("score-summary");
    summary.innerHTML = "";

    teams.forEach(t => {
      const row = document.createElement("div");
      row.className = "score-row";
      row.innerHTML = `
        <span>${t.logo} <strong>${t.name}</strong></span>
        <span style="color: var(--accent); font-weight: bold;">+${roundScores[t.name] || 0} pont</span>
      `;
      summary.appendChild(row);
    });
  }

  window.onload = initApp;
</script>
</body>
</html>
